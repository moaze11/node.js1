name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    env:
      # Valeurs factices pour la CI : les tests mockent Prisma et n'utilisent aucune vraie base
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      RESEND_API_KEY: re_ci_dummy

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check (src + tests)
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --ci
